spring.application.name=Mangrove-MonitorLite
server.port=${SERVER_PORT:8088}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${MANGROVE_DB_URL:jdbc:mysql://localhost:3306/mangrove_monitor_lite?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${MANGROVE_DB_USERNAME:mangrove}
spring.datasource.password=${MANGROVE_DB_PASSWORD:}
spring.sql.init.mode=${MANGROVE_SCHEMA_INIT_MODE:always}
spring.sql.init.continue-on-error=false

mangrove.mqtt.enabled=${MANGROVE_MQTT_ENABLED:false}
mangrove.mqtt.broker-uri=${MANGROVE_MQTT_BROKER:tcp://127.0.0.1:1883}
mangrove.mqtt.topic=${MANGROVE_MQTT_TOPIC:mangrove/+/telemetry}
mangrove.mqtt.client-id=${MANGROVE_MQTT_CLIENT_ID:mangrove-monitor-lite}

mangrove.telemetry.expected-interval-seconds=${MANGROVE_EXPECTED_INTERVAL_SECONDS:5}
mangrove.anomaly.missing-multiplier=${MANGROVE_MISSING_MULTIPLIER:2.0}
mangrove.anomaly.mad-window=${MANGROVE_MAD_WINDOW:25}
mangrove.anomaly.mad-min-samples=${MANGROVE_MAD_MIN_SAMPLES:8}
mangrove.anomaly.mad-threshold=${MANGROVE_MAD_THRESHOLD:6.0}
mangrove.anomaly.iforest-min-samples=${MANGROVE_IFOREST_MIN_SAMPLES:32}
mangrove.anomaly.iforest-trees=${MANGROVE_IFOREST_TREES:64}
mangrove.anomaly.iforest-sample-size=${MANGROVE_IFOREST_SAMPLE_SIZE:128}
mangrove.anomaly.iforest-retrain-every=${MANGROVE_IFOREST_RETRAIN_EVERY:100}
mangrove.anomaly.iforest-threshold=${MANGROVE_IFOREST_THRESHOLD:0.60}
mangrove.anomaly.iforest-seed=${MANGROVE_IFOREST_SEED:20240719}